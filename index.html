<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edward-Night ✨ Botón corazón especial</title>
<style>
  /* Animación de fondo degradado (azules y morados) */
  @keyframes gradientAnimation {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  body {
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    color: #e0f2fe;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;

    /* Fondo degradado animado en tonos azules y morados */
    background: linear-gradient(270deg, #0f172a, #1e1b4b, #3b82f6, #8b5cf6, #1e1b4b, #0f172a);
    background-size: 800% 800%;
    animation: gradientAnimation 20s ease infinite;
  }

  #loveBtn {
    position: relative;
    z-index: 10;
    font-size: 4rem;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border: none;
    border-radius: 50%;
    width: 120px;
    height: 120px;
    cursor: pointer;
    color: white;
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #loveBtn:hover {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    transform: scale(1.1);
    box-shadow: 0 8px 25px rgba(96, 165, 250, 0.6);
  }
  .phrase {
    position: absolute;
    z-index: 20;
    color: #fff;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    padding: 8px 16px;
    border-radius: 25px;
    font-weight: bold;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.8);
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    font-family: 'Segoe UI', 'Poppins', sans-serif;
    opacity: 1;
    animation-fill-mode: forwards;
    animation-timing-function: ease-out;
  }

  /* CRÉDITO EDWARD-NIGHT */
  .credit {
    position: fixed;
    bottom: 15px;
    right: 18px;
    font-size: 11px;
    background: rgba(0,0,0,0.5);
    padding: 5px 12px;
    border-radius: 30px;
    backdrop-filter: blur(5px);
    color: #94a3b8;
    z-index: 200;
    font-family: monospace;
    letter-spacing: 0.8px;
  }
  .credit span {
    color: #60a5fa;
    font-weight: bold;
  }

  @media (max-width: 600px) {
    .phrase {
      font-size: 12px;
      white-space: normal;
      text-align: center;
      max-width: 200px;
    }
  }
</style>
</head>
<body>

<button id="loveBtn" aria-label="Botón corazón">💙</button>

<!-- CRÉDITO -->
<div class="credit">Hecho por <span>Edward-Night</span> ✨</div>

<script>
  const phrasesOriginal = [
    "💙 Eres hermosa sin esfuerzo. 💙",
    "💜 Tienes una mirada que destaca. 💜",
    "✨ Tu sonrisa tiene algo especial. ✨",
    "💙 Inteligente y segura, así eres. 💙",
    "💜 Bonita por dentro y por fuera. 💜",
    "✨ Me encanta tu forma de pensar. ✨",
    "💙 Tienes estilo y mucha personalidad. 💙",
    "💜 Eres fuerte, pero también muy dulce. 💜",
    "✨ Brillas sin hacer ruido. ✨",
    "💙 Tu vibra es de las que se quedan. 💙",
    "💜 Eres real, y eso vale mucho. 💜",
    "✨ Encantas sin intentarlo. ✨",
    "💙 Naturalmente linda. 💙",
    "💜 Siempre de buen gusto. 💜",
    "✨ Sabes estar sin querer llamar la atención. ✨",
    "💙 Eres increíble. 💙",
    "💜 Eres mi persona favorita. 💜"
  ];

  let phrases = [...phrasesOriginal];

  const loveBtn = document.getElementById('loveBtn');

  const directions = [
    { x: 0, y: -120 },
    { x: -80, y: -100 },
    { x: 80, y: -100 },
    { x: -120, y: 0 },
    { x: 120, y: 0 },
    { x: -80, y: -40 },
    { x: 80, y: -40 },
    { x: 0, y: -150 }
  ];

  loveBtn.addEventListener('click', () => {
    if (phrases.length === 0) {
      phrases = [...phrasesOriginal];
    }

    const index = Math.floor(Math.random() * phrases.length);
    const phraseText = phrases.splice(index, 1)[0];

    const phraseEl = document.createElement('span');
    phraseEl.className = 'phrase';
    phraseEl.textContent = phraseText;

    const rect = loveBtn.getBoundingClientRect();
    phraseEl.style.left = rect.left + rect.width / 2 + 'px';
    phraseEl.style.top = rect.top + rect.height / 2 + 'px';
    phraseEl.style.transform = 'translate(-50%, -50%)';

    const dir = directions[Math.floor(Math.random() * directions.length)];
    const duration = 7000; // 7 segundos

    phraseEl.animate([
      { transform: 'translate(-50%, -50%) translate(0, 0)', opacity: 1 },
      { transform: `translate(-50%, -50%) translate(${dir.x}px, ${dir.y}px) scale(1.15)`, opacity: 0 }
    ], {
      duration: duration,
      easing: 'ease-out',
      fill: 'forwards'
    });

    document.body.appendChild(phraseEl);

    setTimeout(() => {
      phraseEl.remove();
    }, duration);
  });
</script>

</body>
</html>
